[tool.poetry]
name = "sts2-downloader"
version = "0.1.0"
description = "CLI tool to download Slay the Spire 2 run data from the Spire Codex API"
authors = []
readme = "README.md"
packages = [{ include = "sts2_downloader", from = "src" }]

[tool.poetry.scripts]
sts2-download = "sts2_downloader.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28"
click = "^8.1"
python-dotenv = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
